name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Tests (ripgrep)
        run: dotnet test -c Release --nologo
      - name: Tests (built-in search)
        run: dotnet test -c Release --nologo --no-build
        env:
          EXEC_MCP_RG: none
      - name: sni-router tests
        working-directory: deploy/sni-router
        run: go vet ./... && go test ./...

      - name: Release archive
        run: SKIP_TESTS=1 ./build.sh

      - name: Install from the archive (system .NET) and run end-to-end
        run: |
          sh install.sh --from "$PWD/dist" --prefix /tmp/x/exec-mcp --bin-dir /tmp/x/bin
          python3 tests/e2e/stdio_check.py /tmp/x/bin/exec-mcp

      - name: Plugin conformance (examples)
        run: |
          export EXEC_MCP_HOME=$(mktemp -d)
          mkdir -p "$EXEC_MCP_HOME/plugins"
          cp -r examples/plugins/notes examples/plugins/wordcount examples/plugins/echo "$EXEC_MCP_HOME/plugins/"
          for p in notes wordcount echo; do /tmp/x/bin/exec-mcp plugin approve $p --yes && /tmp/x/bin/exec-mcp plugin test $p; done

      - name: Example script tools load
        run: |
          export EXEC_MCP_HOME=$(mktemp -d)
          ln -s "$PWD/examples/tools" "$EXEC_MCP_HOME/tools"
          /tmp/x/bin/exec-mcp tools list

      - name: Installer on Alpine (musl, root, private runtime)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -c '
            apk add --no-cache python3 curl >/dev/null &&
            sh tests/e2e/installer_check.sh /src/dist root'

      - name: Installer on Debian (glibc, non-root, private runtime)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq python3 curl ca-certificates libstdc++6 libssl3 >/dev/null &&
            useradd -m u && su - u -c "sh /src/tests/e2e/installer_check.sh /src/dist user"'

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7
